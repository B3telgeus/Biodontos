// Compose compiler stability configuration for Biodontos
// Applied via composeCompiler.stabilityConfigurationFile in app/build.gradle.kts

// Standard Java time types (LocalDate, LocalDateTime, LocalTime, YearMonth, Instant, ZoneId)
java.time.*

// Kotlinx immutable collections & datetime
kotlinx.collections.immutable.*
kotlinx.datetime.*

// Arrow-kt functional types (Either, Option, Validated)
arrow.core.*

// Supabase GoTrue user models
io.github.jan.supabase.gotrue.user.*

// Android framework immutable URI type
android.net.Uri

