name: Biodontos Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'ci-placeholder-anon-key' }}

jobs:
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin, assemble debug APK, and compile androidTest
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Upload Compose compiler reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-compiler-reports
          path: app/build/compose_compiler/
          retention-days: 14

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

  unit-and-compose-host-tests:
    name: Unit & Compose Host Tests (Robolectric)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit and Robolectric Compose tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  detekt-and-lint:
    name: Detekt & Android Lint
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt and Android Lint
        run: |
          chmod +x gradlew
          ./gradlew :app:detekt :app:lintDebug

      - name: Upload Detekt & Lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-and-lint-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  compose-stability-check:
    name: Compose Stability Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Compose compiler reports
        uses: actions/download-artifact@v4
        with:
          name: compose-compiler-reports
          path: app/build/compose_compiler

      - name: Verify Compose stability baseline
        run: |
          chmod +x tools/ci/check-compose-stability.sh
          bash tools/ci/check-compose-stability.sh

  kover-coverage:
    name: Kover Coverage Gate
    runs-on: ubuntu-latest
    needs: unit-and-compose-host-tests
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Kover coverage (>= 80%) and generate XML report
        run: |
          chmod +x gradlew
          ./gradlew :app:koverVerify :app:koverXmlReport

      - name: Upload Kover reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kover-reports
          path: app/build/reports/kover/
          retention-days: 14

  instrumented-gmd:
    name: Instrumented Tests (GMD pixel2api30)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Run instrumented tests on GMD pixel2api30 (aosp-atd)
        run: |
          chmod +x gradlew
          ./gradlew :app:pixel2api30DebugAndroidTest

      - name: Upload GMD reports and additional test outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmd-instrumented-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
          retention-days: 14
